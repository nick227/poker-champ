name: Server Phase4 Soak Gate

on:
  pull_request:
    paths:
      - "apps/server/src/engine/**"
      - "apps/server/src/rooms/**"
      - "apps/server/src/tests/**"
      - "apps/server/scripts/**"
      - "apps/server/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/server-phase4-soak-gate.yml"
  push:
    branches:
      - main
    paths:
      - "apps/server/src/engine/**"
      - "apps/server/src/rooms/**"
      - "apps/server/src/tests/**"
      - "apps/server/scripts/**"
      - "apps/server/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/server-phase4-soak-gate.yml"
  workflow_dispatch:

jobs:
  phase4-soak-gate:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: "info"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile

      - name: Run Phase7 validation (quick)
        shell: bash
        run: |
          mkdir -p var/logs
          timeout 30m pnpm --dir apps/server phase7:validate:quick

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-soak-artifacts
          path: |
            var/logs/phase7_validation_quick_run1.log
            var/logs/phase7_validation_quick_run1.clean.jsonl
            var/logs/phase7_validation_quick_heartbeat.jsonl
            var/logs/phase7_stepf_dead_path_candidates.txt
            var/logs/phase7_stepf_dead_path_report.md

  room-soak-gate:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: "warn"
      ROOM_SOAK_HANDS: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile

      - name: Run PokerRoom soak validation (quick)
        shell: bash
        run: |
          mkdir -p var/logs
          timeout 30m pnpm --dir apps/server room-soak:validate:quick

      - name: Run canary gate on room soak log (quick)
        shell: bash
        run: |
          pnpm --dir apps/server analyze:canary -- \
            --file "$GITHUB_WORKSPACE/var/logs/room_soak_validation_quick_run1.log" \
            --min-hands-started 5 \
            --min-hand-completion-rate 0.90

      - name: Upload room soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-soak-artifacts
          path: |
            var/logs/room_soak_validation_quick_run1.log
            var/logs/room_soak_validation_quick_run1.clean.jsonl
