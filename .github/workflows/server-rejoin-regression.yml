name: Server Rejoin Regression

on:
  pull_request:
    paths:
      - "apps/server/src/engine/**"
      - "apps/server/src/rooms/**"
      - "apps/server/src/state/**"
      - "apps/server/src/tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/server-rejoin-regression.yml"
  push:
    branches:
      - main
    paths:
      - "apps/server/src/engine/**"
      - "apps/server/src/rooms/**"
      - "apps/server/src/state/**"
      - "apps/server/src/tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/server-rejoin-regression.yml"
  workflow_dispatch:

jobs:
  rejoin-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:churn:pr
      - run: pnpm test:server:rejoin
