name: Client Build Smoke

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile

      - name: Web Build Smoke
        id: web_build
        continue-on-error: true
        run: pnpm build:web

      - name: Desktop Build Smoke
        id: desktop_build
        continue-on-error: true
        run: pnpm build:desktop

      - name: Build Smoke Summary
        if: always()
        run: |
          echo "Web build outcome: ${{ steps.web_build.outcome }}"
          echo "Desktop build outcome: ${{ steps.desktop_build.outcome }}"
          echo "This lane is intentionally non-blocking."

