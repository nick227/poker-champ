name: Server Phase4 Soak Gate Nightly

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  phase4-soak-gate-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LOG_LEVEL: "info"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile

      - name: Run Phase7 validation (standard)
        shell: bash
        run: |
          mkdir -p var/logs
          timeout 85m pnpm --dir apps/server phase7:validate

      - name: Upload nightly soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-soak-nightly-artifacts
          path: |
            var/logs/phase7_validation_run1.log
            var/logs/phase7_validation_run1.clean.jsonl
            var/logs/phase7_validation_run2.log
            var/logs/phase7_validation_run2.clean.jsonl
            var/logs/phase7_validation_heartbeat.jsonl
            var/logs/phase7_stepf_dead_path_candidates.txt
            var/logs/phase7_stepf_dead_path_report.md

  room-soak-gate-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LOG_LEVEL: "warn"
      ROOM_SOAK_HANDS: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile

      - name: Run PokerRoom soak validation (nightly)
        shell: bash
        run: |
          mkdir -p var/logs
          timeout 85m pnpm --dir apps/server room-soak:validate

      - name: Run canary gate on room soak log (nightly)
        shell: bash
        run: |
          pnpm --dir apps/server analyze:canary -- \
            --file var/logs/room_soak_validation_run1.log \
            --min-hands-started 20 \
            --min-hand-completion-rate 0.95

      - name: Upload room soak nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-soak-nightly-artifacts
          path: |
            var/logs/room_soak_validation_run1.log
            var/logs/room_soak_validation_run1.clean.jsonl
